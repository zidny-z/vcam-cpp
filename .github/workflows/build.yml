name: Build VCam Sender

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo Sender
        uses: actions/checkout@v4

      - name: Clone Softcam Repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path external | Out-Null
          git clone --depth 1 https://github.com/tshino/softcam.git external/softcam

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- Build Softcam DLL ----------
      - name: Build Softcam x64
        shell: cmd
        run: |
          msbuild external\softcam\src\softcam\softcam_vs2019.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Softcam Win32
        shell: cmd
        run: |
          msbuild external\softcam\src\softcam\softcam_vs2019.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # ---------- Build Installer ----------
      - name: Build Softcam Installer x64
        shell: cmd
        run: |
          msbuild external\softcam\examples\softcam_installer\softcam_installer_vs2019.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Softcam Installer Win32
        shell: cmd
        run: |
          msbuild external\softcam\examples\softcam_installer\softcam_installer_vs2019.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # ---------- Download stb headers ----------
      - name: Download stb headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "src/stb_image.h"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/deprecated/stb_image_resize.h" -OutFile "src/stb_image_resize.h"

      # ---------- Build sender.exe (x64) ----------
      - name: Compile sender
        shell: pwsh
        run: |
          $inc = "${{ github.workspace }}\external\softcam\include"
          $lib = "${{ github.workspace }}\external\softcam\src\softcam\x64\Release"

          Write-Host "Verifying include directory:"
          Get-ChildItem -Path $inc -Recurse

          cl.exe /EHsc /O2 /std:c++17 /Tp src\sender.cpp /I "$inc" /I "src" /link /LIBPATH:"$lib" softcam.lib user32.lib gdi32.lib ole32.lib oleaut32.lib uuid.lib /OUT:sender.exe

      # ---------- Package Artifacts ----------
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path sender.exe) { Copy-Item sender.exe dist\ }
          if (Test-Path assets\fotoorang2.jpeg) { Copy-Item assets\fotoorang2.jpeg dist\ }

          # Copy Softcam DLLs
          if (Test-Path external\softcam\src\softcam\x64\Release\softcam.dll) {
              Copy-Item external\softcam\src\softcam\x64\Release\softcam.dll dist\
          }
          if (Test-Path external\softcam\src\softcam\Release\softcam.dll) {
              Copy-Item external\softcam\src\softcam\Release\softcam.dll dist\softcam_x86.dll
          } elseif (Test-Path external\softcam\src\softcam\Win32\Release\softcam.dll) {
              Copy-Item external\softcam\src\softcam\Win32\Release\softcam.dll dist\softcam_x86.dll
          }

          # Copy Installers
          if (Test-Path external\softcam\examples\softcam_installer\x64\Release\softcam_installer.exe) {
              Copy-Item external\softcam\examples\softcam_installer\x64\Release\softcam_installer.exe dist\
          }
          if (Test-Path external\softcam\examples\softcam_installer\Release\softcam_installer.exe) {
              Copy-Item external\softcam\examples\softcam_installer\Release\softcam_installer.exe dist\softcam_installer_x86.exe
          } elseif (Test-Path external\softcam\examples\softcam_installer\Win32\Release\softcam_installer.exe) {
              Copy-Item external\softcam\examples\softcam_installer\Win32\Release\softcam_installer.exe dist\softcam_installer_x86.exe
          }

          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-sender-win64
          path: dist/
