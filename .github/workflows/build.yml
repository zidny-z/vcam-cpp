name: Build VCam Sender

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (dengan submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- Debug: Lihat struktur direktori ----------
      - name: Inspect Repository Structure
        shell: pwsh
        run: |
          Write-Host "--- Isi folder external/softcam ---"
          if (Test-Path external/softcam) { Get-ChildItem -Path external/softcam -Force }
          Write-Host "--- Mencari file .sln ---"
          if (Test-Path external/softcam) { Get-ChildItem -Path external/softcam -Filter *.sln -Recurse }

      # ---------- Build Softcam DLL ----------
      - name: Build Softcam x64
        shell: cmd
        run: |
          if exist external\softcam\softcam.sln (
            msbuild external\softcam\softcam.sln /p:Configuration=Release /p:Platform=x64 /m
          ) else if exist external\softcam\softcam_vs2019.sln (
            msbuild external\softcam\softcam_vs2019.sln /p:Configuration=Release /p:Platform=x64 /m
          ) else (
            echo "Solution file tidak ditemukan!" & exit /b 1
          )

      - name: Build Softcam Win32
        shell: cmd
        run: |
          if exist external\softcam\softcam.sln (
            msbuild external\softcam\softcam.sln /p:Configuration=Release /p:Platform=Win32 /m
          ) else if exist external\softcam\softcam_vs2019.sln (
            msbuild external\softcam\softcam_vs2019.sln /p:Configuration=Release /p:Platform=Win32 /m
          ) else (
            echo "Solution file tidak ditemukan!" & exit /b 1
          )

      # ---------- Build Installer ----------
      - name: Build Softcam Installer x64
        shell: cmd
        run: |
          if exist external\softcam\examples\softcam_installer\softcam_installer.sln (
            msbuild external\softcam\examples\softcam_installer\softcam_installer.sln /p:Configuration=Release /p:Platform=x64 /m
          )

      - name: Build Softcam Installer Win32
        shell: cmd
        run: |
          if exist external\softcam\examples\softcam_installer\softcam_installer.sln (
            msbuild external\softcam\examples\softcam_installer\softcam_installer.sln /p:Configuration=Release /p:Platform=Win32 /m
          )

      # ---------- Download stb headers ----------
      - name: Download stb headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "src/stb_image.h"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize.h" -OutFile "src/stb_image_resize.h"

      # ---------- Build sender.exe (x64) ----------
      - name: Compile sender
        shell: cmd
        run: |
          cl /EHsc /O2 /std:c++17 /I external\softcam\dist\include src\sender.cpp ^
             /link /LIBPATH:external\softcam\dist\lib\x64 softcam.lib ^
             user32.lib gdi32.lib ole32.lib oleaut32.lib uuid.lib ^
             /OUT:sender.exe

      # ---------- Paket artifact ----------
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path sender.exe) { Copy-Item sender.exe dist\ }
          if (Test-Path assets\fotoorang2.jpeg) { Copy-Item assets\fotoorang2.jpeg dist\ }
          if (Test-Path external\softcam\dist\bin\x64\softcam.dll) { Copy-Item external\softcam\dist\bin\x64\softcam.dll dist\ }
          if (Test-Path external\softcam\dist\bin\Win32\softcam.dll) { Copy-Item external\softcam\dist\bin\Win32\softcam.dll dist\softcam_x86.dll }
          if (Test-Path external\softcam\examples\softcam_installer\x64\Release\softcam_installer.exe) { Copy-Item external\softcam\examples\softcam_installer\x64\Release\softcam_installer.exe dist\ }
          if (Test-Path external\softcam\examples\softcam_installer\Win32\Release\softcam_installer.exe) { Copy-Item external\softcam\examples\softcam_installer\Win32\Release\softcam_installer.exe dist\softcam_installer_x86.exe }
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-sender-win64
          path: dist/
