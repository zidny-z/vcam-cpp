name: Build VCam Sender

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo Sender
        uses: actions/checkout@v4

      - name: Clone Softcam Repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path external | Out-Null
          git clone --depth 1 https://github.com/tshino/softcam.git external/softcam

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- Build Softcam DLL ----------
      - name: Build Softcam x64
        shell: cmd
        run: |
          msbuild external\softcam\src\softcam\softcam_vs2019.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Softcam Win32
        shell: cmd
        run: |
          msbuild external\softcam\src\softcam\softcam_vs2019.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # ---------- Build Installer ----------
      - name: Build Softcam Installer x64
        shell: cmd
        run: |
          msbuild external\softcam\examples\softcam_installer\softcam_installer_vs2019.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Softcam Installer Win32
        shell: cmd
        run: |
          msbuild external\softcam\examples\softcam_installer\softcam_installer_vs2019.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # ---------- Download stb headers ----------
      - name: Download stb headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "src/stb_image.h"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/deprecated/stb_image_resize.h" -OutFile "src/stb_image_resize.h"

# ---------- Build sender.exe (x64) ----------
      - name: Compile sender
        shell: pwsh
        run: |
          $inc = "${{ github.workspace }}\external\softcam\src\softcam\dist\include"
          $lib = "${{ github.workspace }}\external\softcam\src\softcam\dist\lib\x64"

          Write-Host "Verifying include directory:"
          Get-ChildItem -Path $inc -Recurse

          cl.exe /EHsc /O2 /std:c++17 /Tp src\sender.cpp /I "$inc" /I "src" /link /LIBPATH:"$lib" softcam.lib user32.lib gdi32.lib ole32.lib oleaut32.lib uuid.lib /OUT:sender.exe

      # ---------- Paket artifact ----------
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item sender.exe dist\
          Copy-Item assets\fotoorang2.jpeg dist\

          if (-not (Test-Path external\softcam\src\softcam\dist\bin\x64\softcam.dll)) {
            throw "softcam.dll (x64) was not produced by the Softcam build"
          }
          Copy-Item external\softcam\src\softcam\dist\bin\x64\softcam.dll dist\

          $inst64 = Get-ChildItem -Path external\softcam -Filter "softcam_installer.exe" -Recurse |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $inst64) {
            throw "softcam_installer.exe (x64) was not produced by the installer build"
          }
          Copy-Item $inst64.FullName dist\

          # x64 registration is what sender.exe needs; both must point at the DLL next to this script.
          Set-Content -Path dist\register.bat -Encoding ASCII -Value @(
            '@echo off',
            'cd /d "%~dp0"',
            '"%~dp0softcam_installer.exe" register "%~dp0softcam.dll"',
            'if errorlevel 1 pause'
          )

          if (Test-Path external\softcam\src\softcam\dist\bin\Win32\softcam.dll) {
            Copy-Item external\softcam\src\softcam\dist\bin\Win32\softcam.dll dist\softcam_x86.dll
            $inst32 = Get-ChildItem -Path external\softcam -Filter "softcam_installer.exe" -Recurse |
              Where-Object { $_.FullName -match "Win32" } | Select-Object -First 1
            if ($inst32) {
              Copy-Item $inst32.FullName dist\softcam_installer_x86.exe
              Set-Content -Path dist\register_x86.bat -Encoding ASCII -Value @(
                '@echo off',
                'cd /d "%~dp0"',
                '"%~dp0softcam_installer_x86.exe" register "%~dp0softcam_x86.dll"',
                'if errorlevel 1 pause'
              )
            }
          }

          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-sender-win64
          path: dist/
