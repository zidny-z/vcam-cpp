name: Build VCam Sender

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo Sender
        uses: actions/checkout@v4
        # Kita hapus submodules: recursive karena kita akan clone manual

      - name: Clone Softcam Repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path external | Out-Null
          git clone --depth 1 https://github.com/tshino/softcam.git external/softcam

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- Debug: Lihat struktur direktori ----------
      - name: Inspect Repository Structure
        shell: pwsh
        run: |
          Write-Host "--- Isi folder external/softcam ---"
          if (Test-Path external/softcam) { Get-ChildItem -Path external/softcam -Force }
          Write-Host "--- Mencari file .sln ---"
          if (Test-Path external/softcam) { Get-ChildItem -Path external/softcam -Filter *.sln -Recurse }

      # ---------- Build Softcam DLL ----------
      - name: Build Softcam x64
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path external/softcam -Filter *.sln -Recurse | Select-Object -First 1
          if ($sln) {
            Write-Host "Solution ditemukan: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
            Write-Error "File .sln tidak ditemukan!"
            exit 1
          }

      - name: Build Softcam Win32
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path external/softcam -Filter *.sln -Recurse | Select-Object -First 1
          if ($sln) {
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=Win32 /m
          } else {
            Write-Error "File .sln tidak ditemukan!"
            exit 1
          }

      # ---------- Build Installer ----------
      - name: Build Softcam Installer x64
        shell: pwsh
        run: |
          $installerSln = Get-ChildItem -Path external/softcam -Filter "softcam_installer.sln" -Recurse | Select-Object -First 1
          if ($installerSln) {
            Write-Host "Installer solution ditemukan: $($installerSln.FullName)"
            msbuild $installerSln.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
            Write-Warning "softcam_installer.sln tidak ditemukan, melewati langkah ini."
          }

      - name: Build Softcam Installer Win32
        shell: pwsh
        run: |
          $installerSln = Get-ChildItem -Path external/softcam -Filter "softcam_installer.sln" -Recurse | Select-Object -First 1
          if ($installerSln) {
            msbuild $installerSln.FullName /p:Configuration=Release /p:Platform=Win32 /m
          } else {
            Write-Warning "softcam_installer.sln tidak ditemukan, melewati langkah ini."
          }

      # ---------- Download stb headers ----------
      - name: Download stb headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "src/stb_image.h"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize.h" -OutFile "src/stb_image_resize.h"

      # ---------- Build sender.exe (x64) ----------
      - name: Compile sender
        shell: cmd
        run: |
          cl /EHsc /O2 /std:c++17 /I external\softcam\dist\include src\sender.cpp ^
             /link /LIBPATH:external\softcam\dist\lib\x64 softcam.lib ^
             user32.lib gdi32.lib ole32.lib oleaut32.lib uuid.lib ^
             /OUT:sender.exe

      # ---------- Paket artifact ----------
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path sender.exe) { Copy-Item sender.exe dist\ }
          if (Test-Path assets\fotoorang2.jpeg) { Copy-Item assets\fotoorang2.jpeg dist\ }
          if (Test-Path external\softcam\dist\bin\x64\softcam.dll) { Copy-Item external\softcam\dist\bin\x64\softcam.dll dist\ }
          if (Test-Path external\softcam\dist\bin\Win32\softcam.dll) { Copy-Item external\softcam\dist\bin\Win32\softcam.dll dist\softcam_x86.dll }

          # Cari installer secara dinamis (karena path bisa sedikit berbeda)
          $inst64 = Get-ChildItem -Path external\softcam -Filter "softcam_installer.exe" -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          $inst32 = Get-ChildItem -Path external\softcam -Filter "softcam_installer.exe" -Recurse | Where-Object { $_.FullName -match "Win32" } | Select-Object -First 1

          if ($inst64) { Copy-Item $inst64.FullName dist\ }
          if ($inst32) { Copy-Item $inst32.FullName dist\softcam_installer_x86.exe }

          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-sender-win64
          path: dist/
